<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Learning App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .controls {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .alphabet-filter {
            padding: 15px;
            background: white;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
        }

        .letter-btn {
            width: 35px;
            height: 35px;
            border: 2px solid #dee2e6;
            background: white;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .letter-btn:hover, .letter-btn.active {
            background: #667eea;
            color: white;
        }

        .stats {
            padding: 10px 15px;
            background: #fff3cd;
            color: #856404;
            font-weight: 600;
            text-align: center;
            font-size: 14px;
        }

        .vocab-list {
            padding: 15px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .vocab-item {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .vocab-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .vocab-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 10px;
            gap: 5px;
            flex-wrap: wrap;
        }

        #index {
            margin-right: auto;
            font-size: 0.9rem;
            color: #6c757d;
            background-color: #6c757d1a;
            border: #28a7451a 1px solid;
            border-radius: 30%;
            padding: 4px 8px;
        }

        .word-bangla {
            font-size: 1.4rem;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 8px;
        }

        .word-english {
            font-size: 1.2rem;
            font-weight: 600;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .speaker-icon {
            cursor: pointer;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .speaker-icon:hover {
            transform: scale(1.2);
        }

        .blur-toggle {
            padding: 5px 10px;
            background: #ffc107;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        .vocab-item .bangla-blur {
            filter: blur(5px);
            user-select: none;
        }

        .vocab-item .english-blur {
            filter: blur(5px);
            user-select: none;
        }

        .sentence {
            font-size: 0.95rem;
            color: #6c757d;
            font-style: italic;
            padding: 8px;
            background: #f8f9fa;
            border-left: 3px solid #667eea;
            border-radius: 4px;
        }

        .mark-btn {
            padding: 5px 10px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            position: relative;
        }

        .mark-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 5px;
            margin-top: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            min-width: 150px;
        }

        .mark-dropdown.show {
            display: block;
        }

        .mark-option {
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 12px;
            border-bottom: 1px solid #eee;
        }

        .mark-option:last-child {
            border-bottom: none;
        }

        .mark-option:hover {
            background: #f8f9fa;
        }

        .mark-option.level-5 { color: #dc3545; font-weight: bold; }
        .mark-option.level-4 { color: #fd7e14; font-weight: bold; }
        .mark-option.level-3 { color: #ffc107; font-weight: bold; }
        .mark-option.level-2 { color: #20c997; }
        .mark-option.level-1 { color: #6c757d; }

        .vocab-item.marked-5 { border-color: #dc3545; background: #ffe6e6; border-width: 3px; }
        .vocab-item.marked-4 { border-color: #fd7e14; background: #fff3e6; border-width: 3px; }
        .vocab-item.marked-3 { border-color: #ffc107; background: #fffbe6; border-width: 2px; }
        .vocab-item.marked-2 { border-color: #20c997; background: #e6fff8; border-width: 2px; }
        .vocab-item.marked-1 { border-color: #6c757d; background: #f0f0f0; }

        .mark-btn.marked-5 { background: #dc3545; }
        .mark-btn.marked-4 { background: #fd7e14; }
        .mark-btn.marked-3 { background: #ffc107; color: #000; }
        .mark-btn.marked-2 { background: #20c997; }
        .mark-btn.marked-1 { background: #6c757d; }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }
            .word-english {
                font-size: 1.1rem;
            }
            .vocab-item {
                padding: 12px;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }
    </style>
</head>
<body>

            <button class="btn btn-primary" onclick="showMarkedWords()">Marked Words</button>

        <div class="alphabet-filter" id="alphabetFilter"></div>

                    bangla: data[0],
                    sentence: data[1]
                });
            }
            filteredWords = [...allWords];
        }

        function createAlphabetFilter() {
            const container = document.getElementById('alphabetFilter');
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            
            alphabet.forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter;
                btn.onclick = () => filterByLetter(letter);
                container.appendChild(btn);
            });
        }

        function filterByLetter(letter) {
            const buttons = document.querySelectorAll('.letter-btn');
            buttons.forEach(btn => {
                if (btn.textContent === letter) {
                    if (btn.classList.contains('active')) {
                        btn.classList.remove('active');
                        currentFilter = '';
                        filteredWords = [...allWords];
                    } else {
                        buttons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentFilter = letter.toLowerCase();
                        filteredWords = allWords.filter(w => 
                            w.english.toLowerCase().startsWith(currentFilter)
                        );
                        localStorage.setItem('lastLetter', letter);
                    }
                }
            });
            showingMarked = false;
            displayWords(filteredWords);
            updateStats();
        }

        function handleSearch(e) {
            const searchTerm = e.target.value.toLowerCase();
            let wordsToFilter = currentFilter 
                ? allWords.filter(w => w.english.toLowerCase().startsWith(currentFilter))
                : allWords;
            
            filteredWords = wordsToFilter.filter(w => 
                w.english.toLowerCase().includes(searchTerm) ||
                w.bangla.includes(searchTerm)
            );
            displayWords(filteredWords);
            updateStats();
        }

        function displayWords(words) {
            const container = document.getElementById('vocabList');
            container.innerHTML = '';
            
            // Add level filter dropdown when showing marked words
            if (showingMarked) {
                const filterDiv = document.createElement('div');
                filterDiv.style.cssText = 'background:#f8f9fa;padding:15px;margin-bottom:15px;border-radius:10px;border:2px solid #667eea;';
                filterDiv.innerHTML = `
                    <label style="font-weight:bold;margin-right:10px;color:#667eea;">📌 Filter by Level:</label>
                    <select id="markedLevelFilter" style="padding:8px 15px;border:2px solid #667eea;border-radius:8px;font-size:14px;cursor:pointer;background:white;">
                        <option value="all">📚 All Levels</option>
                        <option value="5">★★★★★ Level 5 (খুবই কঠিন)</option>
                        <option value="4">★★★★ Level 4 (কঠিন)</option>
                        <option value="3">★★★ Level 3 (মাঝারি)</option>
                        <option value="2">★★ Level 2 (সহজ)</option>
                        <option value="1">★ Level 1 (খুব সহজ)</option>
                    </select>
                `;
                container.appendChild(filterDiv);
                
                const select = filterDiv.querySelector('#markedLevelFilter');
                select.value = currentLevelFilter;
                select.onchange = function() {
                    filterMarkedByLevel(this.value);
                };
            }
            
            if (words.length === 0) {
                const noResult = document.createElement('div');
                noResult.style.cssText = 'text-align:center;padding:40px;color:#6c757d;';
                noResult.textContent = 'কোনো শব্দ পাওয়া যায়নি';
                container.appendChild(noResult);
                return;
            }

            words.forEach((word, index) => {
                const item = document.createElement('div');
                item.className = 'vocab-item';
                item.dataset.index = index;
                item.dataset.word = word.english;

                const markLevel = markedWords.get(word.english);
                if (markLevel) {
                    item.classList.add(`marked-${markLevel}`);
                }

                const banglaClass = blurredBangla.has(word.english) ? 'bangla-blur' : '';
                const englishClass = blurredEnglish.has(word.english) ? 'english-blur' : '';
                
                const markBtnClass = markLevel ? `marked-${markLevel}` : '';
                const markBtnText = markLevel ? `★ Level ${markLevel}` : '☆ Mark';

                item.innerHTML = `
                    <div class="vocab-header">
                        <p id="index">${index + 1}</p>
                        <button class="blur-toggle" data-word="${word.english}" data-type="bangla">
                            ${blurredBangla.has(word.english) ? '🇧🇩 Unblur' : '🇧🇩 Blur'}
                        </button>
                        <button class="blur-toggle" data-word="${word.english}" data-type="english">
                            ${blurredEnglish.has(word.english) ? '🇬🇧 Unblur' : '🇬🇧 Blur'}
                        </button>
                        <button class="mark-btn ${markBtnClass}" data-word="${word.english}">
                            ${markBtnText}
                            <div class="mark-dropdown">
                                <div class="mark-option level-5" data-level="5">★★★★★ খুবই কঠিন</div>
                                <div class="mark-option level-4" data-level="4">★★★★ কঠিন</div>
                                <div class="mark-option level-3" data-level="3">★★★ মাঝারি</div>
                                <div class="mark-option level-2" data-level="2">★★ সহজ</div>
                                <div class="mark-option level-1" data-level="1">★ খুব সহজ</div>
                                <div class="mark-option" data-level="0" style="color:#dc3545;">✕ Remove Mark</div>
                            </div>
                        </button>
                    </div>
                    <div class="content">
                        <div class="word-bangla ${banglaClass}">${word.bangla}</div>
                        <div class="word-english ${englishClass}">
                            ${word.english}
                            <span class="speaker-icon" data-word="${word.english}">🔊</span>
                        </div>
                        <div class="sentence">${word.sentence}</div>
                    </div>
                `;

                // Blur toggle handlers
                item.querySelectorAll('.blur-toggle').forEach(btn => {
                    btn.onclick = function(e) {
                        e.stopPropagation();
                        const word = this.dataset.word;
                        const type = this.dataset.type;
                        toggleBlur(word, type, this);
                    };
                });

                // Speaker handler
                const speaker = item.querySelector('.speaker-icon');
                speaker.onclick = function(e) {
                    e.stopPropagation();
                    speak(this.dataset.word);
                };

                // Mark button handler
                const markBtn = item.querySelector('.mark-btn');
                markBtn.onclick = function(e) {
                    e.stopPropagation();
                    toggleMarkDropdown(this);
                };

                // Mark options handlers
                item.querySelectorAll('.mark-option').forEach(opt => {
                    opt.onclick = function(e) {
                        e.stopPropagation();
                        const level = parseInt(this.dataset.level);
                        setMarkLevel(word.english, level);
                    };
                });

                item.addEventListener('click', (e) => {
                    if (!e.target.closest('.blur-toggle') && 
                        !e.target.closest('.speaker-icon') &&
                        !e.target.closest('.mark-btn')) {
                        saveLastPosition(index, word.english);
                    }
                });

                container.appendChild(item);
            });
        }

        function speak(word) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }

        function toggleBlur(word, type, button) {
            const item = button.closest('.vocab-item');
            const targetElement = item.querySelector(type === 'bangla' ? '.word-bangla' : '.word-english');
            const targetSet = type === 'bangla' ? blurredBangla : blurredEnglish;
            const blurClass = type === 'bangla' ? 'bangla-blur' : 'english-blur';
            
            if (targetSet.has(word)) {
                targetSet.delete(word);
                targetElement.classList.remove(blurClass);
                button.textContent = type === 'bangla' ? '🇧🇩 Blur' : '🇬🇧 Blur';
            } else {
                targetSet.add(word);
                targetElement.classList.add(blurClass);
                button.textContent = type === 'bangla' ? '🇧🇩 Unblur' : '🇬🇧 Unblur';
            }
        }

        function toggleMarkDropdown(button) {
            const dropdown = button.querySelector('.mark-dropdown');
            const allDropdowns = document.querySelectorAll('.mark-dropdown');
            
            allDropdowns.forEach(d => {
                if (d !== dropdown) d.classList.remove('show');
            });
            
            dropdown.classList.toggle('show');
        }

        function setMarkLevel(word, level) {
            const item = document.querySelector(`[data-word="${word}"]`);
            if (!item) return;
            
            const button = item.querySelector('.mark-btn');
            
            for (let i = 1; i <= 5; i++) {
                item.classList.remove(`marked-${i}`);
                button.classList.remove(`marked-${i}`);
            }
            
            if (level === 0) {
                markedWords.delete(word);
                button.innerHTML = `☆ Mark<div class="mark-dropdown">
                    <div class="mark-option level-5" data-level="5">★★★★★ খুবই কঠিন</div>
                    <div class="mark-option level-4" data-level="4">★★★★ কঠিন</div>
                    <div class="mark-option level-3" data-level="3">★★★ মাঝারি</div>
                    <div class="mark-option level-2" data-level="2">★★ সহজ</div>
                    <div class="mark-option level-1" data-level="1">★ খুব সহজ</div>
                    <div class="mark-option" data-level="0" style="color:#dc3545;">✕ Remove Mark</div>
                </div>`;
            } else {
                markedWords.set(word, level);
                item.classList.add(`marked-${level}`);
                button.classList.add(`marked-${level}`);
                button.innerHTML = `★ Level ${level}<div class="mark-dropdown">
                    <div class="mark-option level-5" data-level="5">★★★★★ খুবই কঠিন</div>
                    <div class="mark-option level-4" data-level="4">★★★★ কঠিন</div>
                    <div class="mark-option level-3" data-level="3">★★★ মাঝারি</div>
                    <div class="mark-option level-2" data-level="2">★★ সহজ</div>
                    <div class="mark-option level-1" data-level="1">★ খুব সহজ</div>
                    <div class="mark-option" data-level="0" style="color:#dc3545;">✕ Remove Mark</div>
                </div>`;
            }
            
            const dropdown = button.querySelector('.mark-dropdown');
            dropdown.querySelectorAll('.mark-option').forEach(opt => {
                opt.onclick = function(e) {
                    e.stopPropagation();
                    const lv = parseInt(this.dataset.level);
                    setMarkLevel(word, lv);
                };
            });
            
            dropdown.classList.remove('show');
            saveMarkedWords();
            updateStats();
        }

        function toggleAllBlur(type) {
            const targetSet = type === 'bangla' ? blurredBangla : blurredEnglish;
            const allBlurred = filteredWords.every(w => targetSet.has(w.english));

            if (allBlurred) {
                targetSet.clear();
            } else {
                filteredWords.forEach(w => targetSet.add(w.english));
            }
            displayWords(filteredWords);
        }

        function showMarkedWords() {
            if (showingMarked) {
                showingMarked = false;
                currentLevelFilter = 'all';
                filteredWords = currentFilter 
                    ? allWords.filter(w => w.english.toLowerCase().startsWith(currentFilter))
                    : [...allWords];
            } else {
                showingMarked = true;
                currentLevelFilter = 'all';
                filteredWords = allWords.filter(w => markedWords.has(w.english));
            }
            displayWords(filteredWords);
            updateStats();
        }

        function filterMarkedByLevel(level) {
            if (level === 'all') {
                currentLevelFilter = 'all';
                filteredWords = allWords.filter(w => markedWords.has(w.english));
            } else {
                currentLevelFilter = parseInt(level);
                filteredWords = allWords.filter(w => markedWords.get(w.english) === currentLevelFilter);
            }
            
            displayWords(filteredWords);
            updateStats();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.letter-btn').forEach(btn => btn.classList.remove('active'));
            currentFilter = '';
            currentLevelFilter = 'all';
            filteredWords = [...allWords];
            showingMarked = false;
            displayWords(filteredWords);
            updateStats();
        }

        function saveMarkedWords() {
            const markedArray = Array.from(markedWords.entries());
            localStorage.setItem('markedWords', JSON.stringify(markedArray));
        }

        function loadMarkedWords() {
            const saved = localStorage.getItem('markedWords');
            if (saved) {
                const markedArray = JSON.parse(saved);
                markedWords = new Map(markedArray);
            }
        }

        function updateStats() {
            const stats = document.getElementById('stats');
            const markedCount = markedWords.size;
            let showingText = '';
            
            if (showingMarked) {
                if (currentLevelFilter !== 'all') {
                    showingText = ` | Level ${currentLevelFilter} Marked Words দেখাচ্ছে`;
                } else {
                    showingText = ' | All Marked Words দেখাচ্ছে';
                }
            }
            
            stats.textContent = `মোট ${allWords.length} টি শব্দ | দেখানো হচ্ছে: ${filteredWords.length} টি | Marked: ${markedCount}${showingText}`;
        }

        function saveLastPosition(index, word) {
            const letter = word.charAt(0).toUpperCase();
            localStorage.setItem('lastPosition', JSON.stringify({
                index: index,
                word: word,
                letter: letter
            }));
        }

        function loadLastPosition() {
            const saved = localStorage.getItem('lastPosition');
            const lastLetter = localStorage.getItem('lastLetter');
            
            if (lastLetter) {
                const letterBtn = Array.from(document.querySelectorAll('.letter-btn'))
                    .find(btn => btn.textContent === lastLetter);
                if (letterBtn) {
                    setTimeout(() => {
                        letterBtn.click();
                        
                        if (saved) {
                            const data = JSON.parse(saved);
                            setTimeout(() => {
                                const item = document.querySelector(`[data-word="${data.word}"]`);
                                if (item) {
                                    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                    item.style.borderColor = '#667eea';
                                    item.style.borderWidth = '3px';
                                }
                            }, 500);
                        }
                    }, 100);
                }
            } else if (saved) {
                const data = JSON.parse(saved);
                setTimeout(() => {
                    const item = document.querySelector(`[data-word="${data.word}"]`);
                    if (item) {
                        item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        item.style.borderColor = '#667eea';
                        item.style.borderWidth = '3px';
                    }
                }, 800);
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
