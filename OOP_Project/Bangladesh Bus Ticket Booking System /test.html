    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .controls {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .alphabet-filter {
            padding: 15px;
            background: white;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
        }

        .letter-btn {
            width: 35px;
            height: 35px;
            border: 2px solid #dee2e6;
            background: white;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .letter-btn:hover, .letter-btn.active {
            background: #667eea;
            color: white;
        }

        .stats {
            padding: 10px 15px;
            background: #fff3cd;
            color: #856404;
            font-weight: 600;
            text-align: center;
            font-size: 14px;
        }

        .vocab-list {
            padding: 15px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .vocab-item {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .vocab-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .vocab-item .bangla-blur {
            filter: blur(5px);
            user-select: none;
        }

        .vocab-item .english-blur {
            filter: blur(5px);
            user-select: none;
        }

        .vocab-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 10px;
        }

        #index {
            margin-right: auto;
            font-size: 0.9rem;
            color: #6c757d;
            background-color: #6c757d1a;
            border: #28a7451a 1px solid;
            border-radius: 30%;
            padding: 4px 8px;
        }

        .word-bangla {
            font-size: 1.4rem;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 8px;
        }

        .word-english {
            font-size: 1.2rem;
            font-weight: 600;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .speaker-icon {
            cursor: pointer;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .speaker-icon:hover {
            transform: scale(1.2);
        }

        .blur-toggle {
            padding: 5px 10px;
            background: #ffc107;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            margin-left: 5px;
        }

        .mark-btn {
            padding: 5px 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            margin-left: 5px;
        }

        .mark-btn.marked {
            background: #28a745;
        }

        .vocab-item.marked-item {
            border-color: #dc3545;
            background: #fff5f5;
        }

        .sentence {
            font-size: 0.95rem;
            color: #6c757d;
            font-style: italic;
            padding: 8px;
            background: #f8f9fa;
            border-left: 3px solid #667eea;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }
            .word-english {
                font-size: 1.1rem;
            }
            .vocab-item {
                padding: 12px;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }
    </style>
</head>

        let allWords = [];
        let filteredWords = [];
        let currentFilter = '';
        let blurredBangla = new Set();
        let blurredEnglish = new Set();
        let markedWords = new Set();
        let showingMarked = false;

        // Initialize app
        function init() {
            loadVocabData();
            loadMarkedWords();
            createAlphabetFilter();
            loadLastPosition();
            displayWords(filteredWords);
            updateStats();
            
            document.getElementById('searchInput')?.addEventListener('input', handleSearch);
        }

        // Load vocabulary data
        function loadVocabData() {
            for (let [word, data] of Object.entries(vocabDataFromDoc)) {
                allWords.push({
                    english: word,
                    bangla: data[0],
                    sentence: data[1]
                });
            }
            filteredWords = [...allWords];
        }

        // Create alphabet filter buttons
        function createAlphabetFilter() {
            const container = document.getElementById('alphabetFilter');
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            
            alphabet.forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter;
                btn.onclick = () => filterByLetter(letter);
                container.appendChild(btn);
            });
        }

        // Filter words by starting letter
        function filterByLetter(letter) {
            const buttons = document.querySelectorAll('.letter-btn');
            buttons.forEach(btn => {
                if (btn.textContent === letter) {
                    if (btn.classList.contains('active')) {
                        btn.classList.remove('active');
                        currentFilter = '';
                        filteredWords = [...allWords];
                    } else {
                        buttons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentFilter = letter.toLowerCase();
                        filteredWords = allWords.filter(w => 
                            w.english.toLowerCase().startsWith(currentFilter)
                        );
                        // Save current letter to localStorage
                        localStorage.setItem('lastLetter', letter);
                    }
                }
            });
            showingMarked = false;
            displayWords(filteredWords);
            updateStats();
        }

        // Handle search
        function handleSearch(e) {
            const searchTerm = e.target.value.toLowerCase();
            let wordsToFilter = currentFilter 
                ? allWords.filter(w => w.english.toLowerCase().startsWith(currentFilter))
                : allWords;
            
            filteredWords = wordsToFilter.filter(w => 
                w.english.toLowerCase().includes(searchTerm) ||
                w.bangla.includes(searchTerm)
            );
            displayWords(filteredWords);
            updateStats();
        }

        // Display words
        function displayWords(words) {
            const container = document.getElementById('vocabList');
            container.innerHTML = '';
            
            if (words.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:#6c757d;">কোনো শব্দ পাওয়া যায়নি</div>';
                return;
            }

            words.forEach((word, index) => {
                const item = document.createElement('div');
                item.className = 'vocab-item';
                item.dataset.index = index;
                item.dataset.word = word.english;

                if (markedWords.has(word.english)) {
                    item.classList.add('marked-item');
                }

                const banglaClass = blurredBangla.has(word.english) ? 'bangla-blur' : '';
                const englishClass = blurredEnglish.has(word.english) ? 'english-blur' : '';
                const isMarked = markedWords.has(word.english);

                item.innerHTML = `
                    <div class="vocab-header">
                        <p id="index">${index + 1}</p>
                        <button class="blur-toggle" onclick="event.stopPropagation(); toggleBlur('${word.english}', 'bangla', this)">
                            ${blurredBangla.has(word.english) ? '🇧🇩 Unblur' : '🇧🇩 Blur'}
                        </button>
                        <button class="blur-toggle" onclick="event.stopPropagation(); toggleBlur('${word.english}', 'english', this)">
                            ${blurredEnglish.has(word.english) ? '🇬🇧 Unblur' : '🇬🇧 Blur'}
                        </button>
                        <button class="mark-btn ${isMarked ? 'marked' : ''}" onclick="event.stopPropagation(); toggleMark('${word.english}', this)">
                            ${isMarked ? '✓ Marked' : '★ Mark'}
                        </button>
                    </div>
                    <div class="content">
                        <div class="word-bangla ${banglaClass}">${word.bangla}</div>
                        <div class="word-english ${englishClass}">
                            ${word.english}
                            <span class="speaker-icon" onclick="event.stopPropagation(); speak('${word.english}')">🔊</span>
                        </div>
                        <div class="sentence">${word.sentence}</div>
                    </div>
                `;

                item.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('blur-toggle') && 
                        !e.target.classList.contains('speaker-icon') &&
                        !e.target.classList.contains('mark-btn')) {
                        saveLastPosition(index, word.english);
                    }
                });

                container.appendChild(item);
            });
        }

        // Text to speech
        function speak(word) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }

        // Toggle blur for individual item
        function toggleBlur(word, type, button) {
            const item = button.closest('.vocab-item');
            const targetElement = item.querySelector(type === 'bangla' ? '.word-bangla' : '.word-english');
            const targetSet = type === 'bangla' ? blurredBangla : blurredEnglish;
            
            if (targetSet.has(word)) {
                targetSet.delete(word);
                targetElement.classList.remove(type === 'bangla' ? 'bangla-blur' : 'english-blur');
                button.textContent = type === 'bangla' ? '🇧🇩 Blur' : '🇬🇧 Blur';
            } else {
                targetSet.add(word);
                targetElement.classList.add(type === 'bangla' ? 'bangla-blur' : 'english-blur');
                button.textContent = type === 'bangla' ? '🇧🇩 Unblur' : '🇬🇧 Unblur';
            }
        }

        // Toggle mark for hard words
        function toggleMark(word, button) {
            const item = button.closest('.vocab-item');
            
            if (markedWords.has(word)) {
                markedWords.delete(word);
                item.classList.remove('marked-item');
                button.classList.remove('marked');
                button.innerHTML = '★ Mark';
            } else {
                markedWords.add(word);
                item.classList.add('marked-item');
                button.classList.add('marked');
                button.innerHTML = '✓ Marked';
            }
            
            saveMarkedWords();
        }

        // Show only marked words
        function showMarkedWords() {
            if (showingMarked) {
                showingMarked = false;
                filteredWords = currentFilter 
                    ? allWords.filter(w => w.english.toLowerCase().startsWith(currentFilter))
                    : [...allWords];
            } else {
                showingMarked = true;
                const markedList = allWords.filter(w => markedWords.has(w.english));
                filteredWords = markedList;
            }
            displayWords(filteredWords);
            updateStats();
        }

        // Save marked words to localStorage
        function saveMarkedWords() {
            localStorage.setItem('markedWords', JSON.stringify([...markedWords]));
        }

        // Load marked words from localStorage
        function loadMarkedWords() {
            const saved = localStorage.getItem('markedWords');
            if (saved) {
                markedWords = new Set(JSON.parse(saved));
            }
        }
        function toggleAllBlur(type) {
            const items = document.querySelectorAll('.vocab-item');
            const targetSet = type === 'bangla' ? blurredBangla : blurredEnglish;
            const className = type === 'bangla' ? 'bangla-blur' : 'english-blur';
            const selector = type === 'bangla' ? '.word-bangla' : '.word-english';
            const allBlurred = items.length === targetSet.size;

            if (allBlurred) {
                targetSet.clear();
                items.forEach(item => {
                    const element = item.querySelector(selector);
                    if (element) {
                        element.classList.remove(className);
                    }
                });
                displayWords(filteredWords);
            } else {
                filteredWords.forEach(word => targetSet.add(word.english));
                items.forEach(item => {
                    const element = item.querySelector(selector);
                    if (element) {
                        element.classList.add(className);
                    }
                });
                displayWords(filteredWords);
            }
        }

        // Reset filters
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.letter-btn').forEach(btn => btn.classList.remove('active'));
            currentFilter = '';
            filteredWords = [...allWords];
            displayWords(filteredWords);
            updateStats();
        }

        // Update statistics
        function updateStats() {
            const stats = document.getElementById('stats');
            const markedCount = markedWords.size;
            const showingText = showingMarked ? ' | Marked Words দেখাচ্ছে' : '';
            stats.textContent = `মোট ${allWords.length} টি শব্দ | দেখানো হচ্ছে: ${filteredWords.length} টি | Marked: ${markedCount}${showingText}`;
        }

        // Save last reading position with letter
        function saveLastPosition(index, word) {
            const letter = word.charAt(0).toUpperCase();
            localStorage.setItem('lastPosition', JSON.stringify({
                index: index,
                word: word,
                letter: letter
            }));
        }

        // Load last reading position
        function loadLastPosition() {
            const saved = localStorage.getItem('lastPosition');
            const lastLetter = localStorage.getItem('lastLetter');
            
            if (lastLetter) {
                // Auto-select the last letter
                const letterBtn = Array.from(document.querySelectorAll('.letter-btn'))
                    .find(btn => btn.textContent === lastLetter);
                if (letterBtn) {
                    setTimeout(() => {
                        letterBtn.click();
                        
                        // Then scroll to last word
                        if (saved) {
                            const data = JSON.parse(saved);
                            setTimeout(() => {
                                const item = document.querySelector(`[data-word="${data.word}"]`);
                                if (item) {
                                    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                    item.style.borderColor = '#667eea';
                                    item.style.borderWidth = '3px';
                                }
                            }, 500);
                        }
                    }, 100);
                }
            } else if (saved) {
                const data = JSON.parse(saved);
                setTimeout(() => {
                    const item = document.querySelector(`[data-word="${data.word}"]`);
                    if (item) {
                        item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        item.style.borderColor = '#667eea';
                        item.style.borderWidth = '3px';
                    }
                }, 800);
            }
        }

        // Start app when page loads
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
